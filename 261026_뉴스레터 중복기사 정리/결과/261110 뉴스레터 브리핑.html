:root {
  --bg: #f5f7fa;
  --surface: #ffffff;
  --ink: #142030;
  --muted: #5b6878;
  --line: #dde3ea;
  --accent: #2450d6;

  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151d; --surface: #17202b; --ink: #e6ebf1; --muted: #9aa7b6; --line: #273342;
    --accent: #7f9ef5; --accent-soft: #1d2a48; --dot-off: #33404f; --work: #4cc3ad; --work-soft: #12302b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151d; --surface: #17202b; --ink: #e6ebf1; --muted: #9aa7b6; --line: #273342;
  --accent: #7f9ef5; --accent-soft: #1d2a48; --dot-off: #33404f; --work: #4cc3ad; --work-soft: #12302b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.65;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
}
.wrap { max-width: 860px; margin: 0 auto; display: grid; gap: 36px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.mast { display: grid; gap: 10px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--muted); font-weight: 500; }
.mast h1 { font-size: clamp(26px, 5vw, 36px); font-weight: 700; letter-spacing: -.01em; }
.mast h1 .date { font-family: var(--font-num); font-weight: 600; color: var(--accent); }
.meta { display: flex; flex-wrap: wrap; gap: 8px; }
.meta span { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: 13px; color: var(--muted); }
.meta b { color: var(--ink); font-family: var(--font-num); font-weight: 600; }
.method { font-size: 13px; color: var(--muted); max-width: 68ch; }

.tldr { background: var(--accent); color: #fff; border-radius: 14px; padding: 20px 22px; display: grid; gap: 10px; }
.tldr h2 { font-size: 13px; letter-spacing: .08em; font-weight: 500; opacity: .85; }
.tldr ol { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; font-size: 16px; font-weight: 500; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tldr { color: #0f151d; } }
:root[data-theme="dark"] .tldr { color: #0f151d; }

section.block { display: grid; gap: 14px; }
.block-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; border-bottom: 2px solid var(--ink); padding-bottom: 8px; }
.block-head h2 { font-size: 20px; font-weight: 700; }
.block-head .sub { font-size: 13px; color: var(--muted); }

.issues { display: grid; gap: 12px; }
.issue { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; }
.rank { grid-row: span 3; font-family: var(--font-num); font-weight: 600; font-size: 28px; line-height: 1; color: var(--accent); min-width: 1.4em; }
.issue h3 { font-size: 17px; font-weight: 700; min-width: 0; }
.cover { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; min-width: 0; }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--dot-off); display: block; }
.dots i.on { background: var(--accent); }
.count { font-family: var(--font-num); font-weight: 600; font-size: 13px; color: var(--accent); }
.chip { font-size: 12px; padding: 1px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--ink); white-space: nowrap; }
.issue p { margin: 6px 0 0; color: var(--ink); min-width: 0; max-width: 68ch; }

.pairs { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px 20px; }
.pairs h3 { font-size: 13px; letter-spacing: .06em; color: var(--muted); font-weight: 500; padding-top: 12px; }
.pairs ul { list-style: none; margin: 0; padding: 0; }
.pairs li { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.pairs li:first-child { border-top: 0; }
.pairs li .t { flex: 1 1 320px; min-width: 0; }
.pairs li .srcs { display: flex; flex-wrap: wrap; gap: 4px; }

.work { background: var(--work-soft); border-radius: 14px; padding: 18px 20px; display: grid; gap: 12px; }
.work .block-head { border-color: var(--work); }
.work .block-head h2 { color: var(--work); }
.work-item { display: grid; gap: 2px; }
.work-item h3 { font-size: 16px; font-weight: 700; }
.work-item .src { font-size: 12px; color: var(--muted); }
.work-item p { margin: 0; max-width: 68ch; }

.status { font-size: 13px; color: var(--muted); display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 14px; }
.status ul { margin: 0; padding-left: 1.2em; }
@media (max-width: 480px) {
  .issue { grid-template-columns: 1fr; }
  .rank { grid-row: auto; font-size: 22px; }
}
</style>

      var p = el('div', 'pairs'); p.appendChild(el('h3', null, '2곳에서 겹친 이슈'));
      var ul = el('ul');
      s.pairs.forEach(function (x) { var li = el('li'); li.appendChild(el('span', 't', x.title)); li.appendChild(chips(x.sources)); ul.appendChild(li); });
      p.appendChild(ul); b.appendChild(p);
    }
    secs.appendChild(b);
  });

  var w = document.getElementById('work');
  if (d.work && d.work.length) {
    var wh = el('div', 'block-head'); wh.appendChild(el('h2', null, '업무상 참고')); wh.appendChild(el('span', 'sub', '중복과 별개로 표시한 콘텐츠·OTT 관련 소식 (제안)')); w.appendChild(wh);
    d.work.forEach(function (x) {
      var it = el('div', 'work-item'); it.appendChild(el('h3', null, x.title)); it.appendChild(el('span', 'src', x.source)); it.appendChild(el('p', null, x.body)); w.appendChild(it);
    });
  } else { w.hidden = true; }

  var st = document.getElementById('status');
  if (d.status && d.status.length) {
    st.appendChild(el('strong', null, '메일함 메모'));
    var u = el('ul'); d.status.forEach(function (x) { u.appendChild(el('li', null, x)); }); st.appendChild(u);
  } else { st.hidden = true; }
})();
</script>
